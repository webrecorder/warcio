name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        os: [ubuntu-latest]
        EXTRA: [false]  # used to force includes to get included
        include:
          - python-version: '3.15'
            os: ubuntu-latest
            EXTRA: true
            NOTALL: true  # without warcio[all]
          - python-version: '3.11'
            os: macos-latest
            EXTRA: true
          - python-version: '3.15'
            os: macos-latest
            EXTRA: true
          - python-version: '3.8'
            os: windows-latest
            EXTRA: true
          - python-version: '3.15'
            os: windows-latest
            EXTRA: true
          - python-version: '3.15'
            os: windows-11-arm
            EXTRA: true
          - python-version: '3.8'
            os: ubuntu-22.04  # oldest version on github actions
            EXTRA: true

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install setuptools on python 3.12+
        if: ${{ matrix.python-version >= '3.12' }}
        run: |
          pip install setuptools

      - name: Install OpenSSL for Windows ARM64
        if: ${{ matrix.os == 'windows-11-arm' }}
        shell: pwsh
        run: |
          # Force set the root to where vcpkg actually runs on the runner
          $vcpkgDir = (Get-Command vcpkg).Source | Split-Path
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          vcpkg install --triplet arm64-windows-static-md --clean-after-build openssl

          "OPENSSL_DIR=${env:VCPKG_ROOT}\installed\arm64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install warcio ALL
        if: ${{ ! matrix.NOTALL }}
        run: pip install .[all,testing]
      - name: Install warcio NOTALL
        if: ${{ matrix.NOTALL }}
        run: pip install .[testing]

      - name: Run tests
        run: python -m pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
